/* login: username, password, continue, lalu selamat datang */
function sha(s){
 if(!(window.crypto&&crypto.subtle&&window.TextEncoder))return Promise.reject(new Error("nocrypto"));
 return crypto.subtle.digest("SHA-256",new TextEncoder().encode("lw1:"+s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")});
}
